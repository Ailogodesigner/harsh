<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="50%" stop-color="#0c0c24"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#dbBg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Database Cylinder Stack in Center -->
  <g transform="translate(600, 340)">
    <!-- Top Cylinder Layer -->
    <g transform="translate(0, -90)">
      <path d="M -150 0 L -150 60 A 150 45 0 0 0 150 60 L 150 0 Z" fill="#0d1430" stroke="#06b6d4" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="150" ry="45" fill="#16224d" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)"/>
      <text x="0" y="8" text-anchor="middle" font-family="monospace" font-weight="800" font-size="16" fill="#38bdf8">PRISMA 6 TYPE ENGINE</text>
    </g>

    <!-- Mid Cylinder Layer -->
    <g transform="translate(0, 0)">
      <path d="M -150 0 L -150 60 A 150 45 0 0 0 150 60 L 150 0 Z" fill="#0b1026" stroke="#818cf8" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="150" ry="45" fill="#11183c" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle" font-family="monospace" font-weight="800" font-size="16" fill="#a5b4fc">NEON POOLED CLIENT</text>
    </g>

    <!-- Bottom Cylinder Layer -->
    <g transform="translate(0, 90)">
      <path d="M -150 0 L -150 60 A 150 45 0 0 0 150 60 L 150 0 Z" fill="#070a1a" stroke="#a3e635" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="150" ry="45" fill="#0c1228" stroke="#a3e635" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle" font-family="monospace" font-weight="800" font-size="16" fill="#a3e635">POSTGRESQL // ACID STORAGE</text>
    </g>

    <!-- Flow particles -->
    <circle cx="-120" cy="-30" r="5" fill="#a3e635" filter="url(#glow)"/>
    <circle cx="120" cy="40" r="6" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Left Stats Block -->
  <g transform="translate(100, 220)">
    <rect width="260" height="130" rx="16" fill="#0a0f24" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#38bdf8">TRANSACTION SAFETY</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">Strict ACID</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#a3e635">Foreign Key Constraints</text>
  </g>

  <!-- Right Block -->
  <g transform="translate(840, 430)">
    <rect width="260" height="130" rx="16" fill="#0a0f24" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#a3e635">SERVERLESS SCALING</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">Instant Read</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#cbd5e1">Neon Edge Compute</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    POSTGRESQL &amp; PRISMA 6
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#06b6d4" letter-spacing="3">
    [ RELATIONAL SCHEMAS // SERVERLESS POOLED PERSISTENCE ]
  </text>
</svg>
