<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="ltBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04020a"/>
      <stop offset="50%" stop-color="#0d091e"/>
      <stop offset="100%" stop-color="#030206"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#ltBg)"/>

  <!-- Center Log Stream Console -->
  <g transform="translate(600, 360)">
    <rect x="-280" y="-170" width="560" height="340" rx="20" fill="#080614" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <!-- Terminal Bar -->
    <rect x="-280" y="-170" width="560" height="40" rx="20" fill="#110d29"/>
    <circle cx="-250" cy="-150" r="5" fill="#ef4444"/>
    <circle cx="-230" cy="-150" r="5" fill="#f59e0b"/>
    <circle cx="-210" cy="-150" r="5" fill="#10b981"/>
    <text x="0" y="-145" text-anchor="middle" font-family="monospace" font-size="12" fill="#a855f7">stream: tail -f /var/log/cloud-engine.log</text>

    <!-- Streaming Lines -->
    <text x="-250" y="-95" font-family="monospace" font-size="13" fill="#a3e635">[11:54:02.102] [INFO] WebSocket tunnel initialized on wss://edge.aditya.dev</text>
    <text x="-250" y="-65" font-family="monospace" font-size="13" fill="#93c5fd">[11:54:02.115] [AUTH] Session handshake: token verified in 1.4ms (SHA256)</text>
    <text x="-250" y="-35" font-family="monospace" font-size="13" fill="#cbd5e1">[11:54:02.130] [STREAM] 1,420 pkts/sec ingested into ring buffer</text>
    <text x="-250" y="-5" font-family="monospace" font-size="13" fill="#facc15">[11:54:02.148] [CACHE] In-memory cache hit ratio: 99.4% (TTL: 3500ms)</text>
    <text x="-250" y="25" font-family="monospace" font-size="13" fill="#38bdf8">[11:54:02.172] [RCON] Broadcast packet synced to Minecraft SMP cluster</text>
    <text x="-250" y="55" font-family="monospace" font-size="13" fill="#a855f7">[11:54:02.190] [PRISMA] Batch telemetry committed to Neon PostgreSQL</text>
    <text x="-250" y="85" font-family="monospace" font-size="13" fill="#a3e635">[11:54:02.210] [HEALTH] 0 dropped frames | 60 FPS fluid rendering</text>
    <text x="-250" y="115" font-family="monospace" font-size="13" fill="#4ade80">&gt; Live tail running with zero lag [■]</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    REAL-TIME LOG TAILER
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#a855f7" letter-spacing="3">
    [ HIGH-THROUGHPUT LOG STREAMING // ZERO-LAG REGEX ENGINE ]
  </text>
</svg>

