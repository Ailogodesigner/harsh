<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060512"/>
      <stop offset="60%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#070414"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#cfGrad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Global Mesh / Globe Center -->
  <g transform="translate(600, 360)">
    <!-- Globe circles -->
    <ellipse cx="0" cy="0" rx="240" ry="240" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="140" ry="240" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="240" ry="100" fill="none" stroke="#a3e635" stroke-width="1" stroke-opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="240" ry="40" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Edge PoP Points -->
    <circle cx="-160" cy="-60" r="8" fill="#f97316" filter="url(#glow)"/>
    <circle cx="-60" cy="90" r="10" fill="#a3e635" filter="url(#glow)"/>
    <circle cx="120" cy="-80" r="9" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="170" cy="70" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="-140" r="8" fill="#f97316" filter="url(#glow)"/>

    <!-- Connecting Rays -->
    <line x1="-160" y1="-60" x2="-60" y2="90" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="-60" y1="90" x2="170" y2="70" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="120" y1="-80" x2="0" y2="-140" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Center Badge -->
    <circle cx="0" cy="0" r="60" fill="#0c091f" stroke="url(#orangeGlow)" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-weight="900" font-size="20" fill="#fb923c">&lt; 15MS</text>
  </g>

  <!-- Left Stats Panel -->
  <g transform="translate(120, 200)">
    <rect width="280" height="150" rx="14" fill="#0d0a21" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="40" font-family="monospace" font-size="12" fill="#fb923c">CLOUDFLARE // PROXIED</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">320+ Cities</text>
    <text x="20" y="115" font-family="monospace" font-size="12" fill="#a3e635">DNSSEC • TLS 1.3 Active</text>
  </g>

  <!-- Right Security Badge -->
  <g transform="translate(800, 480)">
    <rect width="280" height="150" rx="14" fill="#0d0a21" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="40" font-family="monospace" font-size="12" fill="#a3e635">DDOS MITIGATION</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">Layer 7 Shield</text>
    <text x="20" y="115" font-family="monospace" font-size="12" fill="#cbd5e1">100% Edge Availability</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    CLOUDFLARE EDGE WORKERS
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#f97316" letter-spacing="3">
    [ SUB-15MS GLOBAL EDGE ROUTING // ZERO-TRUST ]
  </text>
</svg>

