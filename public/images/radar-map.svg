<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="rdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030208"/>
      <stop offset="50%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020106"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#rdBg)"/>

  <!-- Radar Scope in Center -->
  <g transform="translate(600, 360)">
    <!-- Rings -->
    <circle r="220" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle r="160" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle r="100" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle r="40" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Crosshairs -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Sweep Sector -->
    <path d="M 0 0 L 155 -155 A 220 220 0 0 1 220 0 Z" fill="url(#sweepGrad)"/>

    <!-- Blips & Landmarks -->
    <circle cx="80" cy="-60" r="7" fill="#a3e635" filter="url(#glow)"/>
    <text x="95" y="-55" font-family="monospace" font-size="12" fill="#a3e635">PLAYER [Harsh]</text>

    <circle cx="-90" cy="110" r="6" fill="#f59e0b" filter="url(#glow)"/>
    <text x="-75" y="115" font-family="monospace" font-size="12" fill="#f59e0b">SPAWN [0, 64, 0]</text>

    <circle cx="130" cy="90" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="145" y="95" font-family="monospace" font-size="11" fill="#38bdf8">NETHER PORTAL</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    DYNAMIC CANVAS RADAR &amp; MAP
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#10b981" letter-spacing="3">
    [ 60 FPS HTML5 CANVAS // COORDINATE TRIANGULATION ]
  </text>
</svg>
