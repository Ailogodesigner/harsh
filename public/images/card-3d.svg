<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="tdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04020a"/>
      <stop offset="50%" stop-color="#120a26"/>
      <stop offset="100%" stop-color="#05030d"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#tdBg)"/>

  <!-- 3D Geometric Isometric Mesh -->
  <g transform="translate(600, 360)">
    <!-- Floating Isometric Cube Layers -->
    <g transform="translate(0, -60)">
      <!-- Top Face -->
      <polygon points="0,-100 140,-30 0,40 -140,-30" fill="#1e133d" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Left Face -->
      <polygon points="-140,-30 0,40 0,160 -140,90" fill="#130a29" stroke="#9333ea" stroke-width="2"/>
      <!-- Right Face -->
      <polygon points="0,40 140,-30 140,90 0,160" fill="#0d061c" stroke="#a3e635" stroke-width="2"/>
      
      <!-- Inner Glowing Core -->
      <circle cx="0" cy="40" r="30" fill="#a3e635" filter="url(#glow)" fill-opacity="0.8"/>
    </g>

    <!-- Floating Wireframe Rings -->
    <ellipse cx="0" cy="120" rx="260" ry="80" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="10 12" stroke-opacity="0.5"/>
    <ellipse cx="0" cy="150" rx="200" ry="60" fill="none" stroke="#a3e635" stroke-width="1.2" stroke-dasharray="8 8" stroke-opacity="0.4"/>
  </g>

  <!-- Left Stats -->
  <g transform="translate(120, 220)">
    <rect width="260" height="130" rx="16" fill="#0d0822" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#c084fc">CSS PERSPECTIVE</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">1000px Depth</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#a3e635">Hardware Accelerated</text>
  </g>

  <!-- Right Stats -->
  <g transform="translate(820, 420)">
    <rect width="260" height="130" rx="16" fill="#0d0822" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#a3e635">PARALLAX TRANSLATION</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">TranslateZ (100)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#cbd5e1">Framer Motion Powered</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    3D PERSPECTIVE CARD
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#a3e635" letter-spacing="3">
    [ HOVER PARALLAX // REAL-TIME 3D TRANSFORM ]
  </text>
</svg>

