<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="50%" stop-color="#0a121f"/>
      <stop offset="100%" stop-color="#030208"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#vtBg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Vitest Shield & Terminal in Center -->
  <g transform="translate(600, 340)">
    <!-- Terminal Window -->
    <rect x="-240" y="-140" width="480" height="280" rx="16" fill="#060c14" stroke="url(#limeGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Window Header -->
    <rect x="-240" y="-140" width="480" height="36" rx="16" fill="#0c1726"/>
    <circle cx="-215" cy="-122" r="5" fill="#ef4444"/>
    <circle cx="-195" cy="-122" r="5" fill="#f59e0b"/>
    <circle cx="-175" cy="-122" r="5" fill="#10b981"/>
    <text x="0" y="-117" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">vitest run --coverage</text>

    <!-- Test Results Output -->
    <text x="-210" y="-70" font-family="monospace" font-size="14" fill="#a3e635">✓ src/tests/cashfree.test.ts (3)</text>
    <text x="-210" y="-40" font-family="monospace" font-size="14" fill="#a3e635">✓ src/tests/rcon-pterodactyl.test.ts (4)</text>
    <text x="-210" y="-10" font-family="monospace" font-size="14" fill="#a3e635">✓ src/tests/cloudflare-security.test.ts (2)</text>

    <!-- Divider -->
    <line x1="-210" y1="20" x2="210" y2="20" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Summary line -->
    <text x="-210" y="55" font-family="monospace" font-weight="700" font-size="16" fill="#ffffff">Test Files  </text>
    <text x="-90" y="55" font-family="monospace" font-weight="700" font-size="16" fill="#a3e635">3 passed (3)</text>
    <text x="-210" y="85" font-family="monospace" font-weight="700" font-size="16" fill="#ffffff">Tests       </text>
    <text x="-90" y="85" font-family="monospace" font-weight="700" font-size="16" fill="#a3e635">9 passed (9)</text>
    <text x="-210" y="115" font-family="monospace" font-size="13" fill="#64748b">Duration    </text>
    <text x="-90" y="115" font-family="monospace" font-size="13" fill="#cbd5e1">1.12s (transform 310ms)</text>
  </g>

  <!-- Left Stats Block -->
  <g transform="translate(100, 220)">
    <rect width="250" height="130" rx="16" fill="#07101a" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#4ade80">REGRESSION RATE</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">0.00% Zero</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#a3e635">Deterministic Mocks</text>
  </g>

  <!-- Right Block -->
  <g transform="translate(850, 430)">
    <rect width="250" height="130" rx="16" fill="#07101a" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#a3e635">CI PIPELINE</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">Green Master</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#cbd5e1">Every PR Verified</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    VITEST TDD AUTOMATED TEST SUITE
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#22c55e" letter-spacing="3">
    [ STRICT UNIT &amp; INTEGRATION VERIFICATION // 100% GREEN ]
  </text>
</svg>
