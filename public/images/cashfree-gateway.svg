<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="60%" stop-color="#0f0c26"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#pgBg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Center Card Representation -->
  <g transform="translate(600, 350)">
    <!-- Credit / Fintech Shield Card -->
    <rect x="-240" y="-150" width="480" height="300" rx="28" fill="#0d0a21" stroke="url(#emeraldGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Chip -->
    <rect x="-190" y="-100" width="70" height="50" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <line x1="-165" y1="-100" x2="-165" y2="-50" stroke="#78350f" stroke-width="1.5"/>
    <line x1="-190" y1="-75" x2="-120" y2="-75" stroke="#78350f" stroke-width="1.5"/>

    <!-- Wireless Pay Icon -->
    <path d="M -80 -85 A 30 30 0 0 1 -80 -55" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round"/>
    <path d="M -65 -95 A 45 45 0 0 1 -65 -45" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round"/>

    <!-- Brand Label -->
    <text x="190" y="-80" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#34d399">CASHFREE PG</text>
    <text x="190" y="-55" text-anchor="end" font-family="monospace" font-size="11" fill="#94a3b8">HMAC-SHA256 VERIFIED</text>

    <!-- Card Number obfuscated -->
    <text x="-190" y="30" font-family="monospace" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="4">
      •••• •••• •••• 2026
    </text>

    <!-- Bottom Holder & Expiry -->
    <text x="-190" y="85" font-family="monospace" font-size="11" fill="#64748b">CARDHOLDER</text>
    <text x="-190" y="110" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#e2e8f0">HARSH UNLIMITED</text>

    <text x="190" y="85" text-anchor="end" font-family="monospace" font-size="11" fill="#64748b">UPI QR STATUS</text>
    <text x="190" y="110" text-anchor="end" font-family="monospace" font-weight="800" font-size="16" fill="#a3e635">AUTO-WEBHOOK OK</text>
  </g>

  <!-- Left Stats Capsule -->
  <g transform="translate(100, 220)">
    <rect width="240" height="130" rx="16" fill="#0c091d" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#34d399">INSTANT SETTLEMENT</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-weight="800" font-size="30" fill="#ffffff">₹0.00 Delay</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#a3e635">Direct Bank UPI</text>
  </g>

  <!-- Right Security Capsule -->
  <g transform="translate(860, 420)">
    <rect width="240" height="130" rx="16" fill="#0c091d" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#a3e635">WEBHOOK DEFENSE</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">Strict HMAC</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">Timestamp Replay Prot.</text>
  </g>

  <!-- Bottom Title -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="4">
    CASHFREE PAYMENT GATEWAY
  </text>
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="16" fill="#34d399" letter-spacing="3">
    [ AUTOMATED UPI QR &amp; SECURE CHECKOUT PIPELINE ]
  </text>
</svg>

