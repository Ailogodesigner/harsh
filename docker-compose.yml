version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://harsh_user:secure_password_123@postgres:5432/harsh_unlimited?schema=public
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=replace-with-a-secure-random-32-char-secret
      - APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: harsh_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: harsh_unlimited
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harsh_user -d harsh_unlimited"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
